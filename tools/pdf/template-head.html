<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Linux - Guía de atajos | dajomar.com</title>
<style>
  @page { size: letter; margin: 12mm 12mm 16mm 12mm;
    @bottom-right { content: "Guías y recursos en dajomar.com"; font-family: Inter, sans-serif; font-size: 8pt; color: #0b6e99; font-weight:600; vertical-align: top; padding-top: 4mm; }
    @bottom-left { content: "Linux · Guía de atajos  —  " counter(page) "/" counter(pages); font-family: Inter, sans-serif; font-size: 7.5pt; color: #888; vertical-align: top; padding-top: 4mm; } }
  :root { --accent:#1f9d55; --accent2:#0b6e99; --ink:#1c1c1c; --muted:#3d3d3d; --code:#eef1ef; }
  * { box-sizing: border-box; }
  body { font-family: "Inter", sans-serif; color: var(--ink); font-size: 9.3pt; line-height: 1.38; margin:0; }
  .footer { position: fixed; bottom: -11mm; left:0; right:0; text-align:right; font-size:8pt; color:var(--muted); }
  .footer a { color: var(--accent2); text-decoration:none; font-weight:600; }
  .footer .bar { display:inline-block; width:22px; height:3px; background:var(--accent); vertical-align:middle; margin-right:6px; }
  header { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid var(--accent); padding-bottom:6px; margin-bottom:10px; }
  header h1 { font-size:30pt; margin:0; line-height:1; font-weight:800; letter-spacing:-0.5px; }
  header h1 span { color: var(--accent); }
  header .sub { font-size:15pt; color: var(--accent2); font-weight:300; }
  header .prompt { font-family:"DejaVu Sans Mono", monospace; background:#111; color:#3ddc84; padding:6px 10px; border-radius:5px; font-size:9pt; }
  .cols { column-count:2; column-gap:9mm; }
  h2 { font-size:15pt; font-weight:300; color: var(--accent2); margin:10px 0 4px; break-after: avoid; border-bottom:1px solid #d9e6ee; padding-bottom:2px; }
  h2:first-child { margin-top:0; }
  .item { break-inside: avoid; margin: 0 0 6px; }
  .item > p { margin: 0 0 2px; }
  pre { color:#f2f2f2; font-family:"DejaVu Sans Mono", monospace; font-size:7.9pt; background:#1b1d1f; border-left:3px solid #3ddc84; border-radius:3px; padding:5px 7px; -webkit-print-color-adjust:exact; print-color-adjust:exact; margin:2px 0 3px; white-space:pre-wrap; line-height:1.35; }
  pre .c { color:#8fd19e; }
  .flag { font-family:"DejaVu Sans Mono", monospace; background:var(--accent2); color:#fff; padding:0 3px; border-radius:2px; font-size:8pt; white-space:nowrap; }
  .tip { break-inside: avoid; background:#eaf7ef; border:1px solid #bfe5cc; border-radius:4px; padding:5px 7px; margin:6px 0 8px; }
  .tip b.t { color: var(--accent); display:block; font-size:10pt; }
  table { width:100%; border-collapse:collapse; font-size:8.4pt; margin:2px 0 6px; break-inside: avoid; }
  td, th { border-bottom:1px solid #e2e2e2; padding:2px 4px; vertical-align:top; text-align:left; }
  th { background:#0b6e99; color:#fff; font-weight:600; }
  td:first-child { font-family:"DejaVu Sans Mono", monospace; white-space:nowrap; color:#0b4f6c; font-weight:600; }
  .small { color: var(--muted); font-size:8.6pt; }
  code { font-family:"DejaVu Sans Mono", monospace; font-size:8pt; background:#e3e8e5; color:#0b4f6c; padding:0 3px; border-radius:2px; white-space:nowrap; }
  .brand { display:flex; align-items:center; gap:10px; }
  .tux { width:46pt; height:46pt; flex:none; }
</style>
</head>
<body>
